<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commanders Arsenal | MTG Card Builder</title>

    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">

    <!-- Stylesheet and JavaScript -->

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>

    <div class="logo">

        <a href="index.html">
            <img src="images/logo.png" alt="Commanders Arsenal">
        </a>

        <p>Your place for deckbuilding and card stats.</p>

    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#" class="active">Card Browser</a>
        <a href="#">Commanders</a>
        <a href="#">Deck Builder</a>
        <a href="#">My Decks</a>
    </nav>

</header>

    <main>

        <section class="search-section">

            <h2>Discover Magic: The Gathering</h2>

            <form id="search-form">
                
                <input
                        type="search"
                        id="card-search"
                        placeholder="Search for a card..."
                >

            <label for="set-filter">Expansion</label>

            <select id="set-filter">
                <option value="">All expansions</option>
            </select>

            <label for="color-filter">Colour Identity</label>

        <select id="color-filter">
            <option value="">All colours</option>
            <option value="w">White</option>
            <option value="u">Blue</option>
            <option value="b">Black</option>
            <option value="r">Red</option>
            <option value="g">Green</option>
            <option value="c">Colourless</option>
            <option value="m">Multicoloured</option>
        </select>

        <label for="type-filter">Card type</label>

        <select id="type-filter">
            <option value="">All types</option>
            <option value="creature">Creature</option>
            <option value="artifact">Artifact</option>
            <option value="enchantment">Enchantment</option>
            <option value="instant">Instant</option>
            <option value="sorcery">Sorcery</option>
            <option value="planeswalker">Planeswalker</option>
            <option value="battle">Battle</option>
            <option value="land">Land</option>
        </select>

        <label for="rarity-filter">Rarity</label>

        <select id="rarity-filter">
            <option value="">All rarities</option>
            <option value="common">Common</option>
            <option value="uncommon">Uncommon</option>
            <option value="rare">Rare</option>
            <option value="mythic">Mythic Rare</option>
        </select>

        <label for="sort-filter">Sort by</label>

<select id="sort-filter">
    <option value="name">Card name</option>
    <option value="eur">Price (EUR)</option>
    <option value="cmc">Mana value</option>
    <option value="rarity">Rarity</option>
    <option value="released">Release date</option>
    <option value="edhrec">Commander popularity</option>
</select>

<label for="direction-filter">Sort direction</label>

<select id="direction-filter">
    <option value="asc">Ascending</option>
    <option value="desc">Descending</option>
</select>


            <button type="submit">Search</button>

            <button type="reset" id="reset-filters">Reset filters
            
            </button>

            </form>

            <button id="random-card">Random Card</button>

        </section>

        <section class="results-section">

            <h2>Card Results</h2>

            <p id="result-counter">No search performed.</p>

            <div id="card-container"></div>

        </section>

    </main>

    <footer>
        <p>Commanders Arsenal | Powered by Scryfall API</p>
        <p>Unofficial Magic: The Gathering fan project</p>
    </footer>

</body>
</html>
